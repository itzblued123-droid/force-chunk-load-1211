name: FCL Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o force-chunk-load-1.21.1-port-workspace.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Build mod
        run: |
          cd project
          GRADLEW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle Wrapper tidak ditemukan."
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew build

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: FCL-build
          path: project/**/*.jar
          if-no-files-found: error
