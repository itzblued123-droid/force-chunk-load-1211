name: FCL Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="force-chunk-load-main.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP proyek tidak ditemukan!"
            echo "Daftar file di repository:"
            ls -lah
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Isi proyek setelah diekstrak:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle Wrapper
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan di dalam ZIP!"
            echo "Periksa apakah ZIP berisi proyek Minecraft lengkap."
            exit 1
          fi

          echo "Gradle Wrapper ditemukan: $GRADLEW"
          echo "GRADLEW_PATH=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build Minecraft mod
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FCL-build
          path: project/**/build/libs/*.jar
          if-no-files-found: error
